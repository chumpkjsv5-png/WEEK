name: CI

on:
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Only the packages the app/tests import. requirements.txt also pulls in
      # torch, PyQt5, labelImg, etc., which are slow/fragile to install in CI.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff==0.17.2 \
            fastapi==0.141.1 SQLAlchemy==2.1.1 "pydantic[email]==2.13.5" \
            python-dotenv==1.2.3 pyjwt "pwdlib[argon2]" pymongo

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
